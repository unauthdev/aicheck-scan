name: aicheck agents
description: >-
  Fail the build if coding-agent credential files are in the checkout,
  a Docker context, uploaded artifacts, or world-readable on the runner.
  No network. Does not live-probe a host.
author: unauthdev
branding:
  icon: shield
  color: orange
inputs:
  context:
    description: Docker build context directory to walk (optional).
    required: false
    default: ""
  artifacts:
    description: Artifact directory to walk (optional).
    required: false
    default: ""
  fail-home:
    description: >-
      Also fail if any agent-cred file exists in $HOME. Default only fails
      world-readable home files (Claude Code on the runner is otherwise ok).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.11"

    - name: Install aicheck
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}/.."

    - name: Gate coding-agent credential files
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        ARTIFACTS: ${{ inputs.artifacts }}
        FAIL_HOME: ${{ inputs.fail-home }}
      run: |
        extra=()
        if [ -n "$CONTEXT" ]; then extra+=(--context "$CONTEXT"); fi
        if [ -n "$ARTIFACTS" ]; then extra+=(--artifacts "$ARTIFACTS"); fi
        if [ "$FAIL_HOME" = "true" ]; then extra+=(--fail-home); fi
        aicheck agents --ci "${extra[@]}"
