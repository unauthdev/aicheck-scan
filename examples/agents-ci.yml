# Copy into .github/workflows/agents.yml
# Fails the job if coding-agent credential files are in the checkout,
# a Docker context, or world-readable on the runner. No live probes.
name: agent-creds
on:
  pull_request:
  push:
    branches: [main]
jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: unauthdev/aicheck-scan@v2
